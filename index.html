<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- LOCK SCREEN -->

<div id="lockScreen" class="lock-screen">

<div class="glass">

<h1>🔒</h1>

<h2>Enter Birthday Passcode</h2>

<p>Only Special Person Can Unlock ❤️</p>

<div class="passcode">

<input type="password" maxlength="1" readonly>
<input type="password" maxlength="1" readonly>
<input type="password" maxlength="1" readonly>
<input type="password" maxlength="1" readonly>
<input type="password" maxlength="1" readonly>
<input type="password" maxlength="1" readonly>
<input type="password" maxlength="1" readonly>
<input type="password" maxlength="1" readonly>

</div>

<div class="keypad">

<button class="key">1</button>
<button class="key">2</button>
<button class="key">3</button>

<button class="key">4</button>
<button class="key">5</button>
<button class="key">6</button>

<button class="key">7</button>
<button class="key">8</button>
<button class="key">9</button>

<button class="key">⌫</button>
<button class="key">0</button>
<button class="key">✔</button>

</div>

</div>

</div>

<!-- SURPRISE SCREEN -->

<div id="surprise" class="hidden">

<h1 class="title">
🎉 Happy Birthday 🎉
</h1>

<div class="photos">

<div class="polaroid">
<img src="photo1.jpg" alt="Photo 1">
</div>

<div class="polaroid">
<img src="photo2.jpg" alt="Photo 2">
</div>

</div>

<div id="cakeArea">

<div class="cake">

<div class="candle"></div>

<div class="flame"></div>

<div class="layer top"></div>

<div class="layer middle"></div>

<div class="layer bottom"></div>

</div>

</div>
<!-- Birthday Message -->

<div class="message">

<h2>💖 Happy Birthday My Dear 💖</h2>

<p>
May your life always be filled with happiness,
love, success and endless smiles. 🌸
</p>

<p>
Keep smiling forever 😊❤️
</p>

</div>

<!-- Balloons -->

<div class="balloon b1"></div>
<div class="balloon b2"></div>
<div class="balloon b3"></div>
<div class="balloon b4"></div>
<div class="balloon b5"></div>

<!-- Confetti -->

<div id="confetti"></div>

<!-- Birthday Song -->

<audio id="birthdaySong" loop>
<source src="birthday.mp3" type="audio/mpeg">
</audio>

<!-- Floating Hearts -->

<div class="hearts">

<span>❤️</span>
<span>💖</span>
<span>💕</span>
<span>💝</span>
<span>💗</span>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
